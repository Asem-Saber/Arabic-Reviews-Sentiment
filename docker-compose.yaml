version: "3.9"

services:
  db:
    image: postgres:15
    container_name: arabic_sentiment_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-arabic_sentiment}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: arabic_sentiment_backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=model/cls_model
      - LABEL_MAP_PATH=model/label_map.json
      - DEVICE=-1
      - MAX_LENGTH=128
      - LOG_FILE=logs/app.log
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-arabic_sentiment}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - db
    volumes:
      - ./model:/app/model
      - ./logs:/app/logs

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=http://backend:8000
    container_name: arabic_sentiment_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
